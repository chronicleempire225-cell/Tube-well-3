name: Build APK for Samsung Store

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Dependencies and Build
      run: |
        # अगर आपका प्रोजेक्ट किसी फोल्डर के अंदर है, तो यहाँ उसका नाम लिख सकते हैं
        # फिलहाल यह सीधे रूट फोल्डर के लिए है
        npm install
        npm run build || echo "Skipping npm build if not needed"

    - name: Find and Build with Gradle
      run: |
        # यह कमांड ऑटोमैटिक ढूँढ लेगी कि gradlew फाइल कहाँ है और उसे चलाएगी
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleRelease
        elif [ -f "./android/gradlew" ]; then
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
        else
          echo "Gradlew file not found in root or android folder"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: samsung-release-apk
        path: |
          app/build/outputs/apk/release/app-release.apk
          android/app/build/outputs/apk/release/app-release.apk
