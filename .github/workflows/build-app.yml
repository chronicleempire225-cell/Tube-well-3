name: Build Android App for Play Store

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_OPTIONS: "-Djava.awt.headless=true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find Zip and Extract
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: No ZIP file found!"
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d extracted_project

      - name: Locate Project Root
        id: locate_project
        run: |
          cd extracted_project
          # यह सिर्फ फोल्डर का पाथ ढूंढेगा न कि फाइल का
          PROJECT_FILE=$(find . -maxdepth 3 -name "build.gradle*" -not -path "*/.*" | head -n 1)
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          ABS_PATH=$(realpath "$PROJECT_DIR")
          echo "project_path=$ABS_PATH" >> $GITHUB_OUTPUT

      - name: Force Headless Mode & Build App Bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd "${{ steps.locate_project.outputs.project_path }}"
          
          echo "org.gradle.jvmargs=-Xmx2048m -Djava.awt.headless=true" >> gradle.properties

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew clean bundleRelease \
              -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/generate-keystore/your-keystore-file.jks \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
              --stacktrace --no-configuration-cache
          else
            gradle clean bundleRelease \
              -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/generate-keystore/your-keystore-file.jks \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
              --stacktrace --no-configuration-cache
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: |
            **/build/outputs/bundle/**/*.aab
            
