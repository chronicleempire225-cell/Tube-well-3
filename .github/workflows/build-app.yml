name: Build Android App for Play Store

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # यह सेटिंग सर्वर को बताएगी कि बिना स्क्रीन के ऐप बनाना है
      _JAVA_OPTIONS: "-Djava.awt.headless=true"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Find Zip and Extract
      run: |
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -z "$ZIP_FILE" ]; then
          echo "Error: No ZIP file found!"
          exit 1
        fi
        unzip -q "$ZIP_FILE" -d extracted_project

    - name: Locate Project Root
      id: locate_project
      run: |
        cd extracted_project
        PROJECT_DIR=$(find . -maxdepth 3 -name "build.gradle*" -not -path "*/.*" -exec dirname {} \; | head -n 1)
        ABS_PATH=$(realpath "$PROJECT_DIR")
        echo "project_path=$ABS_PATH" >> $GITHUB_OUTPUT

    - name: Force Headless Mode & Build APK
      run: |
        cd "${{ steps.locate_project.outputs.project_path }}"
        
        # Gradle को स्क्रीन का उपयोग करने से रोकना
        echo "org.gradle.jvmargs=-Xmx2048m -Djava.awt.headless=true" >> gradle.properties
        
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace --no-configuration-cache
        else
          gradle clean assembleDebug --stacktrace --no-configuration-cache
        fi

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: |
          **/build/outputs/apk/**/*.apk
