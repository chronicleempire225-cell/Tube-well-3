name: Build APK for Samsung Store

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Find and Build with Gradle
      run: |
        echo "Searching for gradle wrapper..."
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        elif [ -f "android/gradlew" ]; then
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "No gradlew found, listing directory structure:"
          find . -name "gradlew"
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: samsung-release-apk
        path: |
          **/build/outputs/apk/**/*.apk
          **/*.apk
        if-no-files-found: error
