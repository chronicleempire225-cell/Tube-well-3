name: Build APK from Zip Structure

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Locate and Build inside Zip Folder
      run: |
        echo "Searching where gradlew is hidden inside the uploaded files..."
        find . -name "gradlew" -maxdepth 4
        
        # ऑटोमैटिक ढूंढकर वहीं से बिल्ड चलाना
        GRADLE_PATH=$(find . -name "gradlew" -maxdepth 4 | head -n 1)
        if [ ! -z "$GRADLE_PATH" ]; then
          DIR_NAME=$(dirname "$GRADLE_PATH")
          echo "Found gradlew in: $DIR_NAME"
          cd "$DIR_NAME"
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "Error: gradlew not found anywhere in the uploaded zip structure."
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: samsung-release-apk
        path: |
          **/build/outputs/apk/**/*.apk
          **/*.apk
        if-no-files-found: error
