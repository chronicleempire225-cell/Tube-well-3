name: Build Android App for Play Store

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      JAVA_OPTS: "-Djava.awt.headless=true"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Djava.awt.headless=true'"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find Latest Zip and Extract
        run: |
          # सबसे नई (latest) zip फाइल ढूंढें
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" -printf "%T@ %p\n" | sort -nr | head -n 1 | cut -d' ' -f2-)
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: No ZIP file found in root or subfolders."
            exit 1
          fi
          echo "Selected latest zip file: $ZIP_FILE"
          echo "Extracting $ZIP_FILE..."
          unzip -q "$ZIP_FILE" -d extracted_project

      - name: Locate Project Root & Build App Bundle
        run: |
          # Gradlew फाइल को ढूंढें
          GRADLEW_PATH=$(find extracted_project -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew script not found inside extracted files."
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Project directory found at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # Executable अनुमति दें और App Bundle बनाएं
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: |
            **/build/outputs/bundle/release/*.aab
            
