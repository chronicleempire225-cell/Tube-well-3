name: Build Signed APK for Samsung Store

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Simple Android App
        run: |
          mkdir -p app/src/main
          echo 'android { namespace "com.samsung.app" compileSdk 34 }' > build.gradle

      - name: Create Dummy APK Structure
        run: |
          mkdir -p build/outputs/apk/release/
          echo "Dummy Samsung APK" > build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: samsung-release-apk
          path: '**/build/outputs/**/*.apk'
