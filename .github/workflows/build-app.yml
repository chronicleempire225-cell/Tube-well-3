name: Smart Build APK for Samsung Store

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Find Zip and Extract Automatically
      run: |
        echo "Searching for uploaded ZIP files..."
        ls -la

        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        
        if [ -n "$ZIP_FILE" ]; then
          echo "Found zip file: $ZIP_FILE. Extracting..."
          unzip -o "$ZIP_FILE" -d extracted_project
          cd extracted_project
          ls -la
        else
          echo "No root zip file found, checking current structure..."
        fi

    - name: Build APK with Gradle
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        elif [ -f "extracted_project/gradlew" ]; then
          cd extracted_project
          chmod +x gradlew
          ./gradlew assembleDebug
        elif [ -f "android/gradlew" ]; then
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "Looking deeper for gradlew..."
          FIND_GRADLEW=$(find . -name "gradlew" | head -n 1)
          if [ -n "$FIND_GRADLEW" ]; then
            DIR_NAME=$(dirname "$FIND_GRADLEW")
            cd "$DIR_NAME"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Gradlew wrapper still not found, checking build files..."
          fi
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: samsung-release-apk
        path: |
          **/build/outputs/apk/**/*.apk
          **/*.apk
        if-no-files-found: ignore
