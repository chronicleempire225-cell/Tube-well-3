name: Build Signed APK for Samsung Store

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip Source Code
        run: |
          unzip -o "*.zip" -d . || echo "No zip file found"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew || true

      - name: Build Release APK
        run: ./gradlew bundleRelease || ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: samsung-release-apk
          path: '**/build/outputs/**/*.apk'
