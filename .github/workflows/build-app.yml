name: Build Signed APK for Samsung Store

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: List Project Files
      run: |
        echo "Checking where files are located:"
        find . -maxdepth 3 -name "*.gradle" -o -name "package.json"

    - name: Build with Gradle if available
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug || ./gradlew build || true
        else
          echo "No gradlew found in root"
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: samsung-release-apk
        path: |
          app/build/outputs/apk/**/*.apk
          build/outputs/apk/**/*.apk
          **/*.apk
        if-no-files-found: ignore
