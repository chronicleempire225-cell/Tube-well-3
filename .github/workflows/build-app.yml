name: Build Android App for Play Store

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Find Zip and Extract Automatically
      run: |
        echo "Searching for uploaded ZIP files..."
        ls -la
        
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        
        if [ -z "$ZIP_FILE" ]; then
          echo "Error: No ZIP file found in the repository!"
          exit 1
        fi
        
        echo "Found ZIP file: $ZIP_FILE"
        echo "Extracting contents..."
        unzip -q "$ZIP_FILE" -d extracted_project
        
        echo "Listing extracted contents:"
        ls -la extracted_project

    - name: Locate Project Root
      id: locate_project
      run: |
        cd extracted_project
        PROJECT_DIR=$(find . -maxdepth 2 -name "build.gradle*" -exec dirname {} \; | head -n 1)
        
        if [ -z "$PROJECT_DIR" ]; then
          echo "Error: Could not find build.gradle in the extracted files!"
          exit 1
        end
        
        ABS_PATH=$(realpath "$PROJECT_DIR")
        echo "project_path=$ABS_PATH" >> $GITHUB_OUTPUT
        echo "Found project at: $ABS_PATH"

    - name: Build Bundle (AAB) for Play Store
      run: |
        cd "${{ steps.locate_project.outputs.project_path }}"
        
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./bundleRelease
        else
          gradle bundleRelease
        fi

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: play-store-bundle
        path: |
          **/build/outputs/bundle/**/*.aab
          **/build/outputs/apk/**/*.apk
