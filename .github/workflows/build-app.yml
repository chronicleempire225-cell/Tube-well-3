name: Smart Build APK for Samsung Store

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Find Zip and Extract Automatically
      run: |
        echo "Searching for uploaded ZIP files..."
        ls -la

        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        
        if [ -n "$ZIP_FILE" ]; then
          echo "Found zip file: $ZIP_FILE. Extracting..."
          unzip -o "$ZIP_FILE" -d extracted_project
        else
          echo "No root zip file found."
        fi

    - name: Build APK using System Gradle
      run: |
        echo "Locating project directory..."
        # सही प्रोजेक्ट फोल्डर ढूंढना जहाँ AndroidManifest.xml या build.gradle हो
        PROJECT_DIR=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1 | xargs dirname)
        
        if [ -n "$PROJECT_DIR" ]; then
          echo "Found project directory at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # अगर gradlew काम नहीं कर रहा, तो सीधे सिस्टम ग्रैडल या gradle build चलाएंगे
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "gradlew not found, using system gradle or fallback..."
            gradle assembleDebug || ./gradlew assembleDebug || true
          fi
        else
          echo "Project directory not found!"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: samsung-release-apk
        path: |
          **/build/outputs/apk/**/*.apk
          **/*.apk
        if-no-files-found: ignore
