name: Build Signed APK for Samsung Store

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: ./android   # अगर आपकी फाइलें किसी फोल्डर में हैं, तो यहाँ उसका नाम लिखें (जैसे ./android या ./my-app)

    - name: Build Release APK with Gradle
      run: ./gradlew assembleRelease
      working-directory: ./android   # वही फोल्डर का नाम यहाँ भी देना होगा

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: samsung-release-apk
        path: android/app/build/outputs/apk/release/app-release.apk   # अगर फोल्डर के अंदर है तो आगे फोल्डर का नाम जुड़ जाएगा
